    <script>
      const tl = gsap.timeline({ paused: true });
      gsap.set("#cam", { transformOrigin: "31% 37%" });
      // punch-in per cut so every jump cut reads as intentional
      tl.fromTo("#cam", { scale: 1.25 }, { scale: 1.0, duration: 0.35, ease: "expo.out" }, 0.0);
      tl.set("#cam", { scale: 1.1 }, 1.86);
      tl.set("#cam", { scale: 1.22 }, 3.98);
      tl.set("#cam", { scale: 1.08 }, 5.18);
      tl.set("#cam", { scale: 1.16 }, 6.02);
      tl.set("#cam", { scale: 1.0 }, 7.92);
      tl.set("#cam", { scale: 1.0 }, 10.2);
      tl.set("#cam", { scale: 1.0 }, 12.14);
      tl.set("#cam", { scale: 1.06 }, 13.16);
      tl.set("#cam", { scale: 1.18 }, 14.02);
      tl.set("#cam", { scale: 1.06 }, 14.58);
      tl.set("#cam", { scale: 1.24 }, 15.06);
      tl.set("#cam", { scale: 1.12 }, 15.48);
      tl.set("#cam", { scale: 1.3 }, 16.34);
      tl.fromTo("#cam", { scale: 1.38 }, { scale: 1.18, duration: 0.3, ease: "expo.out", immediateRender: false }, 17.02);
      tl.set("#cam", { scale: 1.04 }, 17.78);
      tl.set("#cam", { scale: 1.12 }, 19.56);
      window.__timelines["main"] = tl;
